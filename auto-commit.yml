name: Realistic Auto Commit Bot (Fail-Proof)

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.ref_name }}

      - name: Get current branch
        id: branch
        run: echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Run commits safely
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "AutoCommit Bot"
          git config --global user.email "bot@example.com"

          echo "Starting safe mode..."

          # Ensure repo has at least 1 file
          if [ ! -f README.md ]; then
            echo "# Auto Commit Repo" > README.md
            git add README.md
            git commit -m "Initial commit"
          fi

          messages=("update logs" "minor fixes" "refactor" "optimize" "update info" "maintenance" "cleanup")
          NUM=$(( (RANDOM % 8) + 3 ))

          for ((i=1; i<=NUM; i++))
          do
            sleep $(( (RANDOM % 20) + 10 ))m

            FILE="file_$((RANDOM % 5 + 1)).txt"
            MSG=${messages[$RANDOM % ${#messages[@]}]}

            echo "Commit $i at $(date)" >> $FILE
            git add $FILE
            git commit -m "$MSG ($(date))" || true

            git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }} HEAD:${{ steps.branch.outputs.BRANCH }} || true

            echo "Commit $i done."
          done
